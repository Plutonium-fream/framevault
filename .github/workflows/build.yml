name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up playback verification
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is not available on PATH.' }

      - name: Run checks and build portable package
        run: ./build.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: FrameVault-portable-win-x64
          path: |
            dist/FrameVault-portable-win-x64.zip
            dist/FrameVault-portable-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload interface previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: FrameVault-interface-previews
          path: artifacts/previews/*.png
          if-no-files-found: ignore
