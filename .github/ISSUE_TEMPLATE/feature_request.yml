name: Feature request
description: Suggest an improvement to FrameVault.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the workflow and any alternatives you considered.
    validations:
      required: true
